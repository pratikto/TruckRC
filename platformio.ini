; ============================================================
; PlatformIO Project Configuration for ESP32 + Logger System
; ============================================================

;   Build options: build flags, source filter
;   Upload options: custom upload port, speed, and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit PlatformIO documentation for other options:
; https://docs.platformio.org/page/projectconf.html


; ============================================================
;  🔧 DEFAULT SETTINGS
; ============================================================
[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
upload_speed = 460800
; aktifkan USB CDC (kalau board mendukung native USB)
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps =
  https://github.com/AlfredoSystems/AlfredoCRSF.git

; ============================================================
;  🧩 DEBUG ENVIRONMENT
; ============================================================
[env:debug-usb]
extends = env
build_type = debug
build_flags =
  -DDEBUG                 ; enable all LOGx() macros
  -DDEBUG_LEVEL=3         ; 0=ERROR, 1=WARN, 2=INFO, 3=DEBUG, 4=VERBOSE
  -DDEBUG_COLOR=1         ; enable ANSI color in log output
  -DCORE_DEBUG_LEVEL=5    ; enable Arduino core debug messages (optional)
  -DDEBUG_CRSF            ; example: enable ELRS-related debug

; --- Default serial monitor (USB)
monitor_port = COM7       ; ⚙️ change to your USB COM port
monitor_flags =
  --echo
  --eol LF

; --- Optional Bluetooth serial monitor
; Pair your ESP32 first (it will appear as "ESP32-Logger")
; then replace the port below with the Bluetooth SPP COM port (e.g., COM7 or COM8)
; Uncomment the line below to enable Bluetooth logging instead of USB
[env:debug-bt]
extends = env
build_type = debug
build_flags =
  -DDEBUG                 ; enable all LOGx() macros
  -DDEBUG_LEVEL=3         ; 0=ERROR, 1=WARN, 2=INFO, 3=DEBUG, 4=VERBOSE
  -DDEBUG_COLOR=1         ; enable ANSI color in log output
  -DCORE_DEBUG_LEVEL=5    ; enable Arduino core debug messages (optional)
  -DDEBUG_CRSF            ; example: enable ELRS-related debug

; --- Default serial monitor (bluetooth)
monitor_port = COM9       ; ⚙️ change to your USB COM port
monitor_flags =
  --echo
  --eol LF

; ============================================================
;  🚀 RELEASE ENVIRONMENT
; ============================================================
[env:release]
extends = env
build_type = release
build_flags =
  -DDEBUG_LEVEL=0         ; compile but only show LOGE (errors)
  -DDEBUG_COLOR=0         ; disable color for clean output
  -Os                     ; optimize for size
monitor_flags =
  --echo
  --eol LF
