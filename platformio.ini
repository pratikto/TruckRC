; ============================================================
; PlatformIO Project Configuration for ESP32 + Logger system
; ============================================================

;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

  
; ============================================================
;  🔧 DEFAULT SETTINGS
; ============================================================
[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
upload_speed = 921600
lib_deps =
  https://github.com/AlfredoSystems/AlfredoCRSF.git

; ============================================================
;  🧩 DEBUG ENVIRONMENT
; ============================================================
[env:debug]
extends = env;
build_type = debug
build_flags =
  -DDEBUG                 ; enable all LOGx() macros
  -DDEBUG_LEVEL=3         ; 0=ERROR,1=WARN,2=INFO,3=DEBUG,4=VERBOSE
  -DDEBUG_COLOR=1         ; enable ANSI color in log
  -DCORE_DEBUG_LEVEL=5    ; enable Arduino core debug messages (optional)
  -DDEBUG_CRSF            ; example: enable ELRS-related debug
monitor_flags =
  --echo
  --eol LF

; ============================================================
;  🚀 RELEASE ENVIRONMENT
; ============================================================
[env:release]
extends = env;
build_type = release
build_flags =
  -DDEBUG_LEVEL=0         ; compile but only show errors (LOGE)
  -DDEBUG_COLOR=0         ; disable color for minimal output
  -Os                     ; optimize for size
monitor_flags =
  --echo
  --eol LF