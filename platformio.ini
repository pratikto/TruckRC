; ============================================================
; PlatformIO Project Configuration for ESP32-C3 + WebSerial
; ============================================================

[env:esp32c3]
; Keep the proven Arduino ESP32 2.x UART implementation used by main.
; WebSerial 2.1.2 also tests this platform generation in its official CI.
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
upload_speed = 460800

build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DDEBUG
  -DDEBUG_LEVEL=3
  -DDEBUG_COLOR=1

; Prevent PlatformIO from selecting similarly named async libraries.
lib_compat_mode = strict

lib_deps =
  https://github.com/AlfredoSystems/AlfredoCRSF.git
  ayushsharma82/WebSerial @ 2.1.2
  esp32async/AsyncTCP @ 3.4.9
  esp32async/ESPAsyncWebServer @ 3.9.2
