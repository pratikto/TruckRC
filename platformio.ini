; ============================================================
; PlatformIO Project Configuration for ESP32-C3 + WebSerial
; ============================================================

[env:esp32c3]
; Arduino ESP32 3.3.4 / ESP-IDF 5.x, matching WebSerial 2.1.2 CI.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.34/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
upload_speed = 460800

build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DDEBUG
  -DDEBUG_LEVEL=3
  -DDEBUG_COLOR=1

; Prevent PlatformIO from selecting similarly named async libraries.
lib_compat_mode = strict

lib_deps =
  https://github.com/AlfredoSystems/AlfredoCRSF.git
  ayushsharma82/WebSerial @ 2.1.2
  esp32async/AsyncTCP @ 3.4.9
  esp32async/ESPAsyncWebServer @ 3.9.2
