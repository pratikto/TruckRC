; ============================================================
; PlatformIO Project Configuration for ESP32 + Logger System
; ============================================================

;   Build options: build flags, source filter
;   Upload options: custom upload port, speed, and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit PlatformIO documentation for other options:
; https://docs.platformio.org/page/projectconf.html

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; ------------------------------
; 🔍 Serial Monitor Configuration
; ------------------------------
monitor_speed = 115200
; Best for ANSI colors from Logger.h (stable colors):
monitor_filters = time, esp32_exception_decoder
; Alternative (if you want PIO to add its own color highlights):
; monitor_filters = colorize, time, esp32_exception_decoder

upload_speed = 460800

; ------------------------------
; ⚙️ Build Flags and Debug Options
; ------------------------------
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1      ; enable native USB CDC
  -DARDUINO_USB_MODE=1             ; use USB mode instead of UART0
  -DDEBUG                          ; enable LOGx() macros
  -DDEBUG_LEVEL=3                  ; 0=ERROR, 1=WARN, 2=INFO, 3=DEBUG, 4=VERBOSE
  -DDEBUG_COLOR=1                  ; enable ANSI color output in Logger.h

; ------------------------------
; 📦 External Libraries
; ------------------------------
lib_deps =
  https://github.com/AlfredoSystems/AlfredoCRSF.git